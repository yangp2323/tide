name: tide

services:
  # 交易机器人（服务名 freqtrade 保持不变：面板通过 http://freqtrade:8080 调用它）
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: tide-bot
    restart: unless-stopped
    mem_limit: 700m
    volumes:
      - ./user_data:/freqtrade/user_data
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --config /freqtrade/user_data/config.json
      --config /freqtrade/user_data/config-private.json
      --strategy TrendFollow

  # 内部服务：填 Key / Telegram、切实盘，只接受 web 转发的内部请求
  panel:
    image: freqtradeorg/freqtrade:stable
    container_name: tide-panel
    restart: unless-stopped
    mem_limit: 700m
    environment:
      - SERVER_IP=${SERVER_IP}
      - PANEL_INTERNAL_TOKEN=${PANEL_INTERNAL_TOKEN}
    volumes:
      - ./user_data:/freqtrade/user_data
      - ./panel:/panel:ro
    # AI 交易要用大模型 SDK，镜像里没有，第一次启动时装上
    entrypoint: ["sh", "-c", "python -c 'import anthropic, openai' 2>/dev/null || pip install -q --user anthropic openai; exec python /panel/app.py"]
    depends_on: [freqtrade]

  # Next.js 页面、登录与 API 入口；源代码挂载，保存后自动更新。
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: tide-web
    restart: unless-stopped
    mem_limit: 800m
    environment:
      - PANEL_ORIGIN=http://panel:8000
      - PANEL_INTERNAL_TOKEN=${PANEL_INTERNAL_TOKEN}
      - PANEL_SESSION_SECRET=${PANEL_SESSION_SECRET}
      - PANEL_AUTH_FILE=/run/panel-auth.json
      - WATCHPACK_POLLING=true
      - NODE_OPTIONS=--max-old-space-size=512
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
      - ./user_data/panel-auth.json:/run/panel-auth.json:ro
    depends_on: [panel]

  # HTTPS
  caddy:
    image: caddy:2-alpine
    container_name: tide-caddy
    restart: unless-stopped
    mem_limit: 100m
    ports:
      - "127.0.0.1:8443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]

  # 443 端口按域名分流：控制台域名 → caddy，其余 → sing-box 代理（已改到 127.0.0.1:8444）
  sni:
    image: nginx:alpine
    container_name: tide-sni
    restart: unless-stopped
    mem_limit: 50m
    network_mode: host
    volumes:
      - ./sni.conf:/etc/nginx/nginx.conf:ro

volumes:
  # 固定卷名：目录改名或换机器时，证书/依赖缓存都还在
  caddy_data:
    name: tide_caddy_data
  web_node_modules:
    name: tide_web_node_modules
  web_next:
    name: tide_web_next
