# 443 端口按域名分流：juyouagent.com 及子域名 → Caddy 控制台，其余（sing-box REALITY 代理）→ sing-box
worker_processes 1;
events { worker_connections 4096; }

stream {
    map $ssl_preread_server_name $backend {
        ~^(.+\.)?juyouagent\.com$  127.0.0.1:8443;
        default                     127.0.0.1:8444;
    }

    server {
        listen 443 reuseport;
        ssl_preread on;
        proxy_pass $backend;
        proxy_connect_timeout 5s;
        proxy_timeout 86400s;
    }
}
